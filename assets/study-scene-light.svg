    <rect x="0" y="8" width="76" height="82" rx="3" fill="#f3ead4" stroke="#a3946e" stroke-width="1"/>
    <path d="M0 28 h76 v-17 q0 -3 -3 -3 h-70 q-3 0 -3 3 z" fill="#a55839"/>
    <circle cx="20" cy="8" r="2.6" fill="none" stroke="#5c5744" stroke-width="1.6"/>
    <circle cx="56" cy="8" r="2.6" fill="none" stroke="#5c5744" stroke-width="1.6"/>
    <text x="38" y="22" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="11" fill="#f3ead4">aug</text>
    <text x="38" y="63" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="30" font-weight="bold" fill="#5a4c36">6</text>
    <text x="38" y="80" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="10" fill="#a3946e">thu</text>
  </g>

