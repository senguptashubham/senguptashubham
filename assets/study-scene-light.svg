    <path d="M832 96 h24 l-3 12 h-18 z" fill="#84462c"/>
    <path d="M838 96 q-6 -10 0 -16 q4 6 3 16 z" fill="#567244"/>
    <path d="M848 96 q6 -10 0 -16 q-4 6 -3 16 z" fill="#425936"/>
