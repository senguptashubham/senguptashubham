    <path d="M856 108 q6 14 2 26" fill="none" stroke="#425936" stroke-width="1.4"/>
    <circle cx="845" cy="128" r="2.6" fill="#567244"/>
    <circle cx="847" cy="140" r="2.3" fill="#425936"/>
    <circle cx="857" cy="126" r="2.3" fill="#425936"/>
