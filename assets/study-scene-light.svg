      <ellipse class="cloudA" cx="238" cy="106" rx="30" ry="9" fill="#e3e8ee" opacity="0.8"/>
      <ellipse class="cloudB" cx="216" cy="99" rx="18" ry="7" fill="#e3e8ee" opacity="0.8"/>
      <g fill="#a3aeba" filter="url(#blurFar)">
