      <g>
        <rect class="lit" x="110" y="156" width="3" height="3" fill="#c98d3d"/>
        <rect class="lit" x="120" y="164" width="3" height="3" fill="#61b3a7"/>
        <rect class="lit" x="110" y="176" width="3" height="3" fill="#c98d3d"/>
        <rect class="lit" x="152" y="166" width="3" height="3" fill="#c98d3d"/>
        <rect class="lit flick" x="160" y="174" width="3" height="3" fill="#c07aae"/>
        <rect class="lit" x="190" y="150" width="3" height="3" fill="#c98d3d"/>
        <rect class="lit" x="198" y="158" width="3" height="3" fill="#c98d3d"/>
        <rect class="lit" x="206" y="150" width="3" height="3" fill="#61b3a7"/>
        <rect class="lit" x="190" y="168" width="3" height="3" fill="#c98d3d"/>
        <rect class="lit" x="236" y="162" width="3" height="3" fill="#c98d3d"/>
        <rect class="lit flick" x="244" y="170" width="3" height="3" fill="#c98d3d"/>
        <rect class="lit" x="268" y="156" width="3" height="3" fill="#61b3a7"/>
        <rect class="lit" x="276" y="164" width="3" height="3" fill="#c98d3d"/>
        <rect class="lit" x="268" y="178" width="3" height="3" fill="#c98d3d"/>
      </g>
      <rect x="209" y="150" width="4" height="24" fill="#c07aae" opacity="0.25" filter="url(#blurGlow)"/>
      <rect class="lit" x="209" y="150" width="4" height="24" fill="#c07aae"/>
      <g class="rain">
        <g class="rainA" stroke-width="1.3" stroke-linecap="round">
          <line x1="112" y1="52" x2="109" y2="66"/><line x1="148" y1="34" x2="145" y2="48"/>
          <line x1="184" y1="58" x2="181" y2="72"/><line x1="220" y1="40" x2="217" y2="54"/>
          <line x1="256" y1="52" x2="253" y2="66"/><line x1="290" y1="44" x2="287" y2="58"/>
        </g>
        <g class="rainB" stroke-width="1.1" stroke-linecap="round" opacity="0.7">
          <line x1="128" y1="46" x2="125" y2="58"/><line x1="164" y1="30" x2="161" y2="42"/>
          <line x1="200" y1="52" x2="197" y2="64"/><line x1="238" y1="34" x2="235" y2="46"/>
          <line x1="272" y1="48" x2="269" y2="60"/>
        </g>
        <g class="rainC" stroke-width="1.5" stroke-linecap="round">
          <line x1="120" y1="38" x2="117" y2="54"/><line x1="172" y1="46" x2="169" y2="62"/>
          <line x1="212" y1="30" x2="209" y2="46"/><line x1="248" y1="42" x2="245" y2="58"/>
          <line x1="282" y1="34" x2="279" y2="50"/>
        </g>
      </g>
    </g>
    <g fill="#775030">
      <rect x="84" y="28" width="232" height="13" rx="3"/>
