    <rect x="16" y="14" width="76" height="54" rx="2" fill="#171310"/>
    <path d="M22 18 v44 h66" stroke="#e0a458" fill="none" opacity="0.4" stroke-width="1"/><path d="M24 22 L29 29 L34 34 L40 39 L46 38 L52 37 L58 42 L66 46 L71 53 L78 57" stroke="#e0a458" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
