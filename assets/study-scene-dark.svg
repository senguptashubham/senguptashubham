        <rect x="244" y="130" width="14" height="46"/><rect x="260" y="138" width="20" height="38"/>
        <rect x="282" y="146" width="14" height="30"/><rect x="298" y="140" width="10" height="36"/>
      </g>
      <rect x="97" y="156" width="206" height="24" fill="#8a5a8f" opacity="0.16" filter="url(#blurGlow)"/>
      <g fill="#151c2d">
        <rect x="104" y="148" width="26" height="71"/><rect x="146" y="158" width="22" height="61"/>
        <rect x="184" y="142" width="30" height="77"/><rect x="230" y="154" width="24" height="65"/>
        <rect x="262" y="148" width="26" height="71"/><rect x="296" y="158" width="7" height="61"/>
      </g>
      <g>
        <rect class="lit" x="110" y="156" width="3" height="3" fill="#e0a458"/>
        <rect class="lit" x="120" y="164" width="3" height="3" fill="#5fd0c0"/>
        <rect class="lit" x="110" y="176" width="3" height="3" fill="#e0a458"/>
        <rect class="lit" x="152" y="166" width="3" height="3" fill="#e0a458"/>
        <rect class="lit flick" x="160" y="174" width="3" height="3" fill="#d268b0"/>
        <rect class="lit" x="190" y="150" width="3" height="3" fill="#e0a458"/>
        <rect class="lit" x="198" y="158" width="3" height="3" fill="#e0a458"/>
        <rect class="lit" x="206" y="150" width="3" height="3" fill="#5fd0c0"/>
        <rect class="lit" x="190" y="168" width="3" height="3" fill="#e0a458"/>
        <rect class="lit" x="236" y="162" width="3" height="3" fill="#e0a458"/>
        <rect class="lit flick" x="244" y="170" width="3" height="3" fill="#e0a458"/>
        <rect class="lit" x="268" y="156" width="3" height="3" fill="#5fd0c0"/>
        <rect class="lit" x="276" y="164" width="3" height="3" fill="#e0a458"/>
        <rect class="lit" x="268" y="178" width="3" height="3" fill="#e0a458"/>
      </g>
      <rect x="209" y="150" width="4" height="24" fill="#d268b0" opacity="0.55" filter="url(#blurGlow)"/>
      <rect class="lit" x="209" y="150" width="4" height="24" fill="#d268b0"/>
      <g>
        <path class="wind windA" d="M104 66 q18 -6 36 0 q16 5 30 -1"/>
        <path class="wind windB" d="M120 96 q16 -5 32 0 q14 4 26 -1"/>
        <g class="leafG">
          <path d="M0 0 q4 -5 8 0 q-4 5 -8 0 z" fill="#587347"/>
          <path d="M8 0 l3 -1.5" stroke="#445c37" stroke-width="1" stroke-linecap="round"/>
        </g>
      </g>
    </g>
    <g fill="#77502e">
      <rect x="84" y="28" width="232" height="13" rx="3"/>
      <rect x="84" y="28" width="13" height="204" rx="3"/>
      <rect x="303" y="28" width="13" height="204" rx="3"/>
