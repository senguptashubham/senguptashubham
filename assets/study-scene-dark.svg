    <path d="M856 108 q6 14 2 26" fill="none" stroke="#445c37" stroke-width="1.4"/>
    <circle cx="845" cy="128" r="2.6" fill="#587347"/>
    <circle cx="847" cy="140" r="2.3" fill="#445c37"/>
    <circle cx="857" cy="126" r="2.3" fill="#445c37"/>
    <circle cx="859" cy="134" r="2" fill="#587347"/>
    <g>
