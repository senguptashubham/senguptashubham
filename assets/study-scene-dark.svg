        <circle cx="268" cy="69" r="2.4" fill="#241f36" opacity="0.4"/>
        <circle cx="276" cy="76" r="1.6" fill="#241f36" opacity="0.4"/>
        <circle cx="274.4" cy="72" r="10.6" fill="#0f1420"/>
      </g>
      <circle cx="111" cy="53" r="1.0" fill="#e8ddc2" opacity="0.4"/>
      <circle cx="214" cy="68" r="0.8" fill="#e8ddc2" opacity="0.7"/>
      <circle cx="182" cy="82" r="1.0" fill="#e8ddc2" opacity="0.4"/>
      <circle cx="127" cy="83" r="1.0" fill="#e8ddc2" opacity="0.55"/>
      <ellipse class="cloudA" cx="150" cy="78" rx="30" ry="10" fill="#2a3450" opacity="1.0"/>
      <ellipse class="cloudB" cx="170" cy="71" rx="19" ry="8" fill="#2a3450" opacity="1.0"/>
      <g fill="#252e47" filter="url(#blurFar)">
        <rect x="100" y="140" width="16" height="36"/><rect x="118" y="132" width="14" height="44"/>
        <rect x="134" y="146" width="20" height="30"/><rect x="156" y="126" width="16" height="50"/>
        <rect x="174" y="138" width="12" height="38"/><rect x="188" y="122" width="18" height="54"/>
