    <rect x="258" y="258" width="72" height="9" rx="2" fill="#87482e"/>
    <rect x="258" y="258" width="6" height="9" fill="#c9bd9e"/>
    <g transform="rotate(-4 290 252)">
      <rect x="262" y="250" width="52" height="4" rx="2" fill="#e0a458"/>
      <path d="M314 250 l7 2 l-7 2 z" fill="#ddd1b4"/>
      <rect x="258" y="250" width="6" height="4" rx="2" fill="#a75c3c"/>
    </g>
  </g>

  <!-- mechanical watch -->
  <g>
    <rect x="338" y="258" width="26" height="9" rx="4" fill="#5a3c20"/>
    <rect x="380" y="258" width="26" height="9" rx="4" fill="#5a3c20"/>
    <circle cx="372" cy="262" r="17" fill="#514c3c"/>
