  </g>

  <!-- tear-off calendar -->
  <g transform="translate(376,54) rotate(-2)">
    <rect x="0" y="8" width="76" height="82" rx="3" fill="#ddd1b4" stroke="#a99a78" stroke-width="1"/>
    <path d="M0 28 h76 v-17 q0 -3 -3 -3 h-70 q-3 0 -3 3 z" fill="#a75c3c"/>
    <circle cx="20" cy="8" r="2.6" fill="none" stroke="#514c3c" stroke-width="1.6"/>
    <circle cx="56" cy="8" r="2.6" fill="none" stroke="#514c3c" stroke-width="1.6"/>
    <text x="38" y="22" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="11" fill="#ddd1b4">aug</text>
    <text x="38" y="63" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="30" font-weight="bold" fill="#6b5d45">10</text>
    <text x="38" y="80" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="10" fill="#a99a78">mon</text>
  </g>

