  <!-- retro macintosh, today's plot on screen -->
  <g transform="translate(432,158)">
    <path d="M6 0 h96 q6 0 6 6 v92 h-108 v-92 q0 -6 6 -6 z" fill="#cfc3a6"/>
    <path d="M0 98 h108 v10 q0 4 -4 4 h-100 q-4 0 -4 -4 z" fill="#b8ab8d"/>
