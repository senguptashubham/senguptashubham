      <rect x="97" y="115" width="206" height="7"/>
    </g>
    <rect x="84" y="28" width="232" height="13" rx="3" fill="#916740" opacity="0.35"/>
    <rect x="76" y="232" width="248" height="12" rx="3" fill="#77502e"/>
    <rect x="76" y="232" width="248" height="3" rx="1.5" fill="#916740" opacity="0.5"/>
    <g transform="translate(150,10)">
