<svg width="920" height="400" viewBox="0 0 920 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="an engineer's study at night: a desk with a retro computer, a lamp, a watch, a shelf of books, and a window showing today's weather over a distant city">
  <defs>
    <style>
      .rain line { stroke:#9db4d0; opacity:0.5; }
      .rainA { animation: fall 1.35s linear infinite; }
      .rainB { animation: fall 1.6s linear infinite; animation-delay:-0.6s; }
      .rainC { animation: fall 1.15s linear infinite; animation-delay:-0.3s; }
      @keyframes fall { from { transform: translateY(-40px); } to { transform: translateY(200px); } }
      .snowA { animation: snowfall 5.5s linear infinite; }
      .snowB { animation: snowfall 7s linear infinite; animation-delay:-2.5s; }
      .snowC { animation: snowfall 4.5s linear infinite; animation-delay:-1s; }
      @keyframes snowfall { from { transform: translate(0,-30px); } to { transform: translate(14px,200px); } }
      .cloudA { animation: drift 70s ease-in-out infinite alternate; }
      .cloudB { animation: drift 95s ease-in-out infinite alternate-reverse; }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(16px); } }
      .wind { fill:none; stroke:#9db4d0; stroke-width:1.4; stroke-linecap:round; opacity:0; }
      .windA { animation: gust 9s ease-in-out infinite; }
      .windB { animation: gust 9s ease-in-out infinite; animation-delay:4.5s; }
      @keyframes gust {
        0% { transform: translateX(-50px); opacity:0; }
        15% { opacity:0.3; }
        55% { opacity:0.2; }
        100% { transform: translateX(230px); opacity:0; }
      }
      .leafG { animation: leaffly 13s linear infinite; }
      @keyframes leaffly {
        0% { transform: translate(80px,52px) rotate(0deg); opacity:0; }
        8% { opacity:0.85; }
        30% { transform: translate(140px,74px) rotate(160deg); opacity:0.85; }
        55% { transform: translate(205px,58px) rotate(300deg); opacity:0.85; }
        80% { transform: translate(262px,84px) rotate(460deg); opacity:0.8; }
        94% { opacity:0; }
        100% { transform: translate(310px,68px) rotate(540deg); opacity:0; }
      }
      .lit { opacity: 0.9; }
      .flick { animation: flick 9s ease-in-out infinite; }
      @keyframes flick {
        0%,44%,56%,69%,75%,100% { opacity: 0.9; }
        50% { opacity: 0.2; }
        72% { opacity: 0.45; }
      }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity:0; } }
      .steam { fill:none; stroke:#c9bd9e; stroke-width:1.6; stroke-linecap:round; opacity:0; }
      .steamA { animation: rise 3.8s ease-in-out infinite; }
      .steamB { animation: rise 3.8s ease-in-out infinite; animation-delay:1.7s; }
      @keyframes rise {
        0% { opacity:0; transform: translateY(0); }
        25% { opacity:0.45; }
        100% { opacity:0; transform: translateY(-16px); }
      }
      .secondhand { animation: sweep 60s linear infinite; transform-origin: 372px 262px; }
      @keyframes sweep { to { transform: rotate(360deg); } }
      .lampglow { animation: breathe 7s ease-in-out infinite; }
      @keyframes breathe { 0%,100% { opacity:0.55; } 50% { opacity:0.85; } }
      @media (prefers-reduced-motion: reduce) {
        .rainA,.rainB,.rainC,.snowA,.snowB,.snowC,.cloudA,.cloudB,.cursor,.steamA,.steamB,.secondhand,.lampglow,.flick,.windA,.windB,.leafG { animation:none; }
        .leafG { opacity:0; }
        .steam { opacity:0.3; }
      }
    </style>
    <radialGradient id="moonglow">
      <stop offset="30%" stop-color="#e8ddc2" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e8ddc2" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="skygrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1420"/>
      <stop offset="55%" stop-color="#1a2133"/>
      <stop offset="100%" stop-color="#241f36"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0a458" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#e0a458" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="floorfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fadeMask">
      <rect x="0" y="0" width="920" height="296" fill="#ffffff"/>
      <rect x="0" y="296" width="920" height="80" fill="url(#floorfade)"/>
    </mask>
    <filter id="blurFar" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="blurGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <clipPath id="panes">
      <rect x="97" y="41" width="95" height="74"/>
      <rect x="199" y="41" width="104" height="74"/>
      <rect x="97" y="122" width="95" height="97"/>
      <rect x="199" y="122" width="104" height="97"/>
    </clipPath>
    <clipPath id="moonclip"><circle cx="272" cy="72" r="10"/></clipPath>
  </defs>

  <!-- window -->
  <g>
    <rect x="97" y="41" width="206" height="178" fill="url(#skygrad)"/>
    <g clip-path="url(#panes)">
      <circle cx="272" cy="72" r="20" fill="url(#moonglow)"/>
      <g clip-path="url(#moonclip)">
