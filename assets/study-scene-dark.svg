      <rect x="0" y="36" width="28" height="6" rx="1.5" fill="#c9bd9e"/>
    </g>
    <path d="M832 96 h24 l-3 12 h-18 z" fill="#87482e"/>
    <path d="M838 96 q-6 -10 0 -16 q4 6 3 16 z" fill="#587347"/>
    <path d="M848 96 q6 -10 0 -16 q-4 6 -3 16 z" fill="#445c37"/>
    <rect x="636" y="110" width="252" height="10" rx="3" fill="#77502e"/>
    <rect x="636" y="110" width="252" height="3" rx="1.5" fill="#916740" opacity="0.5"/>
    <path d="M652 120 l-6 12 M872 120 l6 12" stroke="#5a3c20" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- desk lamp -->
  <g>
    <path class="lampglow" d="M683 196 L711 216 L705 279 L585 279 Z" fill="url(#cone)"/>
    <ellipse class="lampglow" cx="645" cy="283" rx="88" ry="7" fill="#e0a458" opacity="0.09"/>
    <rect x="726" y="272" width="54" height="9" rx="4" fill="#3a362a"/>
    <path d="M753 274 v-52" fill="none" stroke="#514c3c" stroke-width="4.5" stroke-linecap="round"/>
