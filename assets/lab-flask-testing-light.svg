<svg width="420" height="140" viewBox="0 0 420 140" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code','Consolas',monospace">
  <defs>
    <clipPath id="flaskBody">
      <path d="M 190 45 L 160 95 L 160 100 L 240 100 L 240 95 L 210 45 Z"/>
    </clipPath>
    <style>
      .dot0 { animation: pulse 1.6s ease-in-out infinite; }
      .dot1 { animation: pulse 1.6s ease-in-out infinite; animation-delay: 0.3s; }
      .dot2 { animation: pulse 1.6s ease-in-out infinite; animation-delay: 0.6s; }
      @keyframes pulse { 0%,100% { opacity: 0.15; } 50% { opacity: 1; } }
      .bubble { animation: rise 2s ease-in infinite; }
      @keyframes rise { 0% { transform: translateY(0); opacity: 0.9; } 100% { transform: translateY(-24px); opacity: 0; } }
    </style>
  </defs>

  <rect x="1" y="1" width="418" height="138" rx="8" fill="none" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- retort stand -->
  <line x1="120" y1="25" x2="120" y2="105" stroke="#d0d7de" stroke-width="3"/>
  <line x1="105" y1="105" x2="140" y2="105" stroke="#d0d7de" stroke-width="3"/>

  <!-- clasp arm -->
  <rect x="118" y="38" width="70" height="5" fill="#7d715a"/>

  <!-- flask outline -->
  <path d="M 190 20 L 210 20 L 210 45 L 240 95 L 240 100 L 160 100 L 160 95 L 190 45 Z"
        fill="none" stroke="#24292f" stroke-width="2" stroke-linejoin="round"/>
  <!-- stopper -->
  <rect x="187" y="12" width="26" height="9" rx="1" fill="#5a5142"/>

  <!-- liquid -->
  <rect x="150" y="70" width="100" height="30" fill="#9a6700" opacity="0.55" clip-path="url(#flaskBody)"/>

  <!-- bubbles -->
  <g clip-path="url(#flaskBody)">
    <circle cx="185" cy="92" r="2.5" fill="#f2c04a" class="bubble" style="animation-delay:0s"/>
    <circle cx="200" cy="94" r="2" fill="#f2c04a" class="bubble" style="animation-delay:0.6s"/>
    <circle cx="212" cy="90" r="2.5" fill="#f2c04a" class="bubble" style="animation-delay:1.2s"/>
  </g>

  <!-- pixel callout bubble -->
  <g>
    <rect x="255" y="35" width="150" height="46" fill="none" stroke="#9a6700" stroke-width="1.5"/>
    <rect x="247" y="43" width="8" height="8" fill="none" stroke="#9a6700" stroke-width="1.5"/>
    <rect x="239" y="51" width="8" height="8" fill="none" stroke="#9a6700" stroke-width="1.5"/>
    <text x="270" y="63" font-size="15" fill="#9a6700">testing<tspan class="dot0">.</tspan><tspan class="dot1">.</tspan><tspan class="dot2">.</tspan></text>
  </g>
</svg>
