<svg width="800" height="240" viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#e6e8eb" stroke-width="1"/>
    </pattern>
    <style>
      .power-dot { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
      .steam { animation: rise 3s ease-in-out infinite; transform-origin: center; }
      .steam1 { animation-delay: 0s; }
      .steam2 { animation-delay: 1s; }
      @keyframes rise { 0% { opacity: 0; transform: translateY(0); } 30% { opacity: 0.6; } 100% { opacity: 0; transform: translateY(-14px); } }
    </style>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <!-- base + graph-paper grid -->
  <rect width="800" height="240" fill="url(#grid)"/>
  <rect x="1" y="1" width="798" height="238" fill="none" stroke="#d0d7de" stroke-width="1.5" rx="8"/>

  <!-- desk scene, top right: old macintosh + a small plant, bottom-aligned -->

  <!-- classic macintosh -->
  <g transform="translate(610,12) scale(1.5)">
    <rect x="12" y="0" width="24" height="4" fill="#ded3ba"/>
    <rect x="8" y="4" width="32" height="4" fill="#ded3ba"/>
    <rect x="4" y="8" width="40" height="4" fill="#ded3ba"/>
    <rect x="4" y="12" width="40" height="32" fill="#ded3ba"/>
    <rect x="10" y="16" width="28" height="20" fill="#3a3428"/>
    <rect x="12" y="18" width="24" height="16" fill="#05070a"/>
    <rect x="13" y="19" width="4" height="4" fill="#9a6700" class="power-dot"/>
    <rect x="33" y="38" width="2" height="2" fill="#a89b82"/>
    <rect x="37" y="38" width="2" height="2" fill="#a89b82"/>
    <rect x="4" y="44" width="40" height="4" fill="#c4b89e"/>
    <rect x="18" y="45" width="12" height="2" fill="#5a5142"/>
    <rect x="16" y="48" width="16" height="4" fill="#a89b82"/>
    <rect x="10" y="52" width="28" height="4" fill="#7d715a"/>
  </g>

  <!-- pixel-art potted plant -->
  <g transform="translate(706,30)">
    <rect x="18" y="0"  width="6" height="6" fill="#1a7f37"/>
    <rect x="12" y="6"  width="6" height="6" fill="#1a7f37"/>
    <rect x="18" y="6"  width="6" height="6" fill="#1a7f37"/>
    <rect x="24" y="6"  width="6" height="6" fill="#1a7f37"/>
    <rect x="6"  y="12" width="6" height="6" fill="#1a7f37"/>
    <rect x="12" y="12" width="6" height="6" fill="#1a7f37"/>
    <rect x="18" y="12" width="6" height="6" fill="#1a7f37"/>
    <rect x="24" y="12" width="6" height="6" fill="#1a7f37"/>
    <rect x="30" y="12" width="6" height="6" fill="#1a7f37"/>
    <rect x="6"  y="18" width="6" height="6" fill="#2ea043"/>
    <rect x="12" y="18" width="6" height="6" fill="#1a7f37"/>
    <rect x="18" y="18" width="6" height="6" fill="#1a7f37"/>
    <rect x="24" y="18" width="6" height="6" fill="#1a7f37"/>
    <rect x="30" y="18" width="6" height="6" fill="#2ea043"/>
    <rect x="12" y="24" width="6" height="6" fill="#2ea043"/>
    <rect x="18" y="24" width="6" height="6" fill="#2ea043"/>
    <rect x="24" y="24" width="6" height="6" fill="#2ea043"/>
    <rect x="18" y="30" width="6" height="6" fill="#216e39"/>
    <rect x="18" y="36" width="6" height="6" fill="#216e39"/>
    <rect x="12" y="42" width="6" height="6" fill="#241a12"/>
    <rect x="18" y="42" width="6" height="6" fill="#241a12"/>
    <rect x="24" y="42" width="6" height="6" fill="#241a12"/>
    <rect x="6"  y="48" width="6" height="6" fill="#c9702e"/>
    <rect x="12" y="48" width="6" height="6" fill="#c9702e"/>
    <rect x="18" y="48" width="6" height="6" fill="#c9702e"/>
    <rect x="24" y="48" width="6" height="6" fill="#c9702e"/>
    <rect x="30" y="48" width="6" height="6" fill="#c9702e"/>
    <rect x="12" y="54" width="6" height="6" fill="#a85d27"/>
    <rect x="18" y="54" width="6" height="6" fill="#a85d27"/>
    <rect x="24" y="54" width="6" height="6" fill="#a85d27"/>
    <rect x="12" y="60" width="6" height="6" fill="#8a4a1f"/>
    <rect x="18" y="60" width="6" height="6" fill="#8a4a1f"/>
    <rect x="24" y="60" width="6" height="6" fill="#8a4a1f"/>
  </g>


  <!-- soft grounding shadows -->
  <ellipse cx="643" cy="97" rx="30" ry="5" fill="#000000" opacity="0.18" filter="url(#soft)"/>
  <ellipse cx="724" cy="97" rx="15" ry="4" fill="#000000" opacity="0.18" filter="url(#soft)"/>
  <ellipse cx="645" cy="153" rx="36" ry="4" fill="#000000" opacity="0.18" filter="url(#soft)"/>
  <ellipse cx="718" cy="152" rx="17" ry="4" fill="#000000" opacity="0.18" filter="url(#soft)"/>

  <!-- a small stack of books, sitting below the mac -->
  <g>
    <rect x="610" y="140" width="64" height="12" fill="#7d2e2e"/>
    <rect x="610" y="140" width="4" height="12" fill="#a94444"/>
    <rect x="618" y="128" width="52" height="12" fill="#2a3f6f"/>
    <rect x="618" y="128" width="4" height="12" fill="#44598f"/>
    <rect x="626" y="116" width="38" height="12" fill="#8a6d1f"/>
    <rect x="626" y="116" width="4" height="12" fill="#b08f2c"/>
  </g>

  <!-- a mug, steam rising -->
  <g>
    <rect x="706" y="124" width="24" height="22" fill="#ded3ba"/>
    <rect x="706" y="124" width="24" height="4" fill="#c4b89e"/>
    <rect x="728" y="128" width="10" height="14" fill="none" stroke="#ded3ba" stroke-width="3"/>
    <path d="M 712 122 Q 709 112 713 104" stroke="#57606a" stroke-width="2" fill="none" opacity="0.6" class="steam steam1"/>
    <path d="M 722 122 Q 725 111 721 102" stroke="#57606a" stroke-width="2" fill="none" opacity="0.6" class="steam steam2"/>
  </g>

  <!-- title -->
  <text x="34" y="56" font-family="'Fira Code','Consolas',monospace" font-size="27" font-weight="700" fill="#1f2328">shubham sengupta</text>

  <!-- margin-note line: the pivot, shown as a correction -->
  <text x="34" y="92" font-family="'Fira Code','Consolas',monospace" font-size="15">
    <tspan fill="#57606a" text-decoration="line-through">Senior SDET</tspan><tspan fill="#6e7781"> → </tspan><tspan fill="#1a7f37">understands by rebuilding, verifies by hand</tspan>
  </text>

  <!-- indented margin annotation, directly under, no floating shapes -->
  <text x="52" y="114" font-family="'Fira Code','Consolas',monospace" font-style="italic" font-size="13" fill="#9a6700">↳ re-derive, don't assume</text>

  <!-- verified lines -->
  <text x="34" y="152" font-family="'Fira Code','Consolas',monospace" font-size="14" fill="#24292f"><tspan fill="#1a7f37">✓ </tspan>rebuilds methods from scratch before trusting the library</text>
  <text x="34" y="177" font-family="'Fira Code','Consolas',monospace" font-size="14" fill="#24292f"><tspan fill="#1a7f37">✓ </tspan>compares approaches by running them, not by reputation</text>

  <!-- footer rule -->
  <text x="34" y="215" font-family="'Fira Code','Consolas',monospace" font-size="12" fill="#57606a">notes in the margins, not just the code</text>
</svg>
